services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      POSTGRES_DB: observatorio_dev
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: dev-secret-key-32-chars-minimum!!
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      PYTHONPATH: /workspace/backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devnet

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatorio_dev
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatorio -d observatorio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devnet

volumes:
  postgres_dev:

networks:
  devnet:
    driver: bridge
